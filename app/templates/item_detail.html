{% extends "base.html" %}
{% block title %}Детали предмета{% endblock %}
{% block content %}
<div id="detail" class="space-y-4"></div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
  <div class="bg-[#131B2E] border border-slate-800/80 rounded-md p-3">
    <h2 class="text-xs uppercase tracking-wider text-[#94A3B8] mb-2">История цен</h2>
    <canvas id="priceChart"></canvas>
  </div>
  <div class="bg-[#131B2E] border border-slate-800/80 rounded-md p-3">
    <h2 class="text-xs uppercase tracking-wider text-[#94A3B8] mb-2">Стакан (ближайшие 5)</h2>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <h3 class="text-xs text-[#94A3B8] mb-1">Buy</h3>
        <table class="w-full text-xs" id="buyTable"></table>
      </div>
      <div>
        <h3 class="text-xs text-[#94A3B8] mb-1">Sell</h3>
        <table class="w-full text-xs" id="sellTable"></table>
      </div>
    </div>
  </div>
</div>
<div class="bg-[#131B2E] border border-slate-800/80 rounded-md p-3 mt-4">
  <h2 class="text-xs uppercase tracking-wider text-[#94A3B8] mb-2">Калькулятор</h2>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-2 items-end">
    <div>
      <label class="text-xs text-[#94A3B8]">Куплю за</label>
      <input id="calcBuy" type="number" step="0.01" class="w-full bg-[#0B0F17] border border-slate-800/80 rounded px-2 py-1.5 text-sm font-mono text-[#F8FAFC] mt-1" />
    </div>
    <div>
      <label class="text-xs text-[#94A3B8]">Продам за</label>
      <input id="calcSell" type="number" step="0.01" class="w-full bg-[#0B0F17] border border-slate-800/80 rounded px-2 py-1.5 text-sm font-mono text-[#F8FAFC] mt-1" />
    </div>
    <button id="calcBtn" class="bg-[#10B981] hover:bg-[#0ea371] text-[#0B0F17] font-semibold rounded px-3 py-1.5 text-sm">Посчитать</button>
    <div id="calcResult" class="text-xs text-[#94A3B8]"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const itemId = {{ item_id }};
let chart = null;

async function loadDetail() {
  const res = await fetch('/api/items/' + itemId);
  const d = await res.json();
  const container = document.getElementById('detail');
  container.innerHTML = `
    <div class="bg-[#131B2E] border border-slate-800/80 rounded-md p-3">
      <h1 class="text-lg font-semibold">${d.item.market_hash_name}</h1>
      <p class="text-xs text-[#94A3B8] mt-1">AppID ${d.item.appid}</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
        <div><div class="text-xs text-[#94A3B8]">Lowest Sell</div><div class="text-base font-mono text-[#F8FAFC]">${d.snapshot ? (d.snapshot.lowest_sell ?? '-') : '-'}</div></div>
        <div><div class="text-xs text-[#94A3B8]">Highest Buy</div><div class="text-base font-mono text-[#F8FAFC]">${d.snapshot ? (d.snapshot.highest_buy ?? '-') : '-'}</div></div>
        <div><div class="text-xs text-[#94A3B8]">Маржа %</div><div class="text-base font-mono ${(d.spread_pct ?? 0) >= 0 ? 'text-[#10B981]' : 'text-[#EF4444]'}">${d.spread_pct ?? '-'}</div></div>
        <div><div class="text-xs text-[#94A3B8]">Ликвидность</div><div class="text-base font-mono text-[#F8FAFC]">${d.liquidity_score ?? '-'}</div></div>
      </div>
      <div class="mt-2 text-xs text-[#94A3B8]">Статус: <span class="font-semibold text-[#F8FAFC]">${d.status}</span></div>
      <button id="refreshBtn" class="mt-2 text-xs bg-[#0B0F17] border border-slate-800/80 hover:border-slate-700 rounded px-2 py-1 text-[#94A3B8]">Обновить</button>
    </div>
  `;
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    await fetch('/api/items/'+itemId+'/refresh', {method:'POST'});
    loadDetail(); loadHistory(); loadHistogram();
  });
  if (d.snapshot) {
    document.getElementById('calcBuy').value = d.snapshot.highest_buy ?? '';
    document.getElementById('calcSell').value = d.snapshot.lowest_sell ?? '';
  }
}

async function loadHistory() {
  const res = await fetch('/api/items/' + itemId + '/history');
  const rows = await res.json();
  const labels = rows.map(r => r.captured_at);
  const sell = rows.map(r => r.lowest_sell);
  const buy = rows.map(r => r.highest_buy);
  const ctx = document.getElementById('priceChart').getContext('2d');
  if (chart) chart.destroy();
  const gradient = ctx.createLinearGradient(0, 0, 0, 200);
  gradient.addColorStop(0, 'rgba(16,185,129,0.15)');
  gradient.addColorStop(1, 'rgba(16,185,129,0)');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {label:'Lowest Sell', data: sell, borderColor:'#10B981', backgroundColor: gradient, fill: true, tension:0.25, pointRadius:0},
        {label:'Highest Buy', data: buy, borderColor:'#94A3B8', tension:0.25, pointRadius:0}
      ]
    },
    options: {
      responsive:true,
      plugins: { legend: { labels: { color: '#94A3B8', font: { size: 10 } } }, tooltip: { backgroundColor: '#131B2E', titleColor: '#F8FAFC', bodyColor: '#F8FAFC', borderColor: '#1E293B', borderWidth: 1 } },
      scales: {
        x: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { color: '#1E293B' } },
        y: { ticks: { color: '#94A3B8', font: { size: 9 } }, grid: { color: '#1E293B' } }
      }
    }
  });
}

async function loadHistogram() {
  const res = await fetch('/api/items/' + itemId + '/histogram');
  const d = await res.json();
  const buyTable = document.getElementById('buyTable');
  const sellTable = document.getElementById('sellTable');
  buyTable.innerHTML = '<tr class="text-[#94A3B8]"><th class="text-left py-0.5">Цена</th><th class="text-right py-0.5">Кол-во</th></tr>';
  (d.buy_orders || []).slice(0,5).forEach(o => {
    buyTable.innerHTML += `<tr class="border-b border-slate-800/80"><td class="py-0.5 font-mono">${o.price}</td><td class="text-right py-0.5 font-mono">${o.quantity}</td></tr>`;
  });
  sellTable.innerHTML = '<tr class="text-[#94A3B8]"><th class="text-left py-0.5">Цена</th><th class="text-right py-0.5">Кол-во</th></tr>';
  (d.sell_orders || []).slice(0,5).forEach(o => {
    sellTable.innerHTML += `<tr class="border-b border-slate-800/80"><td class="py-0.5 font-mono">${o.price}</td><td class="text-right py-0.5 font-mono">${o.quantity}</td></tr>`;
  });
}

document.getElementById('calcBtn').addEventListener('click', async () => {
  const buy = parseFloat(document.getElementById('calcBuy').value);
  const sell = parseFloat(document.getElementById('calcSell').value);
  const res = await fetch('/api/calc', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({buy_price: buy, sell_price: sell})});
  const d = await res.json();
  document.getElementById('calcResult').innerHTML = `
    <div class="text-[#94A3B8]">Валовый спред: <span class="font-mono text-[#F8FAFC]">${d.gross_spread}</span></div>
    <div class="text-[#94A3B8]">Комиссия: <span class="font-mono text-[#F8FAFC]">${d.steam_fee}</span></div>
    <div class="text-[#94A3B8]">Чистыми: <span class="font-mono text-[#F8FAFC]">${d.buyer_receives}</span></div>
    <div class="font-semibold ${d.net_profit >= 0 ? 'text-[#10B981]' : 'text-[#EF4444]'}">Прибыль: ${d.net_profit} (${d.net_margin_pct}%)</div>
  `;
});

loadDetail(); loadHistory(); loadHistogram();
</script>
{% endblock %}
